name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip plugin
        run: cd claude/plugins/confluence-wiki && zip -r "$GITHUB_WORKSPACE/confluence-wiki.zip" . -x '*.DS_Store'
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" confluence-wiki.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
